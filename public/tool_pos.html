<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Dukan Hisab · StraticSoft</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">
<header class="bg-white border-b px-4 py-3 flex items-center gap-3">
  <a href="/" class="text-sm text-indigo-600">← Suite</a>
  <h1 class="font-semibold">Dukan Hisab</h1>
</header>
<main class="max-w-xl mx-auto p-4 space-y-4">
  <div class="grid grid-cols-2 gap-3">
    <div class="bg-white border rounded-2xl p-4"><div class="text-xs text-slate-500">Today</div><div id="today" class="text-2xl font-semibold">0</div></div>
    <div class="bg-white border rounded-2xl p-4"><div class="text-xs text-slate-500">All time</div><div id="total" class="text-2xl font-semibold">0</div></div>
  </div>
  <input id="item" placeholder="Item name" class="w-full rounded-xl border px-3 py-2 text-sm"/>
  <input id="amount" type="number" step="0.01" placeholder="Amount" class="w-full rounded-xl border px-3 py-2 text-sm"/>
  <button onclick="add()" class="w-full rounded-xl bg-orange-500 text-white py-2.5 text-sm font-medium">Record sale</button>
  <div id="list" class="space-y-2"></div>
</main>
<script>
async function load(){
  const r=await fetch('/api/tools/pos'); const j=await r.json();
  document.getElementById('today').textContent=Number(j.today||0).toFixed(2);
  document.getElementById('total').textContent=Number(j.total||0).toFixed(2);
  document.getElementById('list').innerHTML=(j.sales||[]).slice(0,30).map(s=>`
    <div class="bg-white border rounded-xl px-3 py-2 flex justify-between text-sm">
      <span>${s.item}</span><span class="font-medium">${Number(s.amount).toFixed(2)}</span>
    </div>`).join('');
}
async function add(){
  const r=await fetch('/api/tools/pos',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({item:item.value||'Sale',amount:parseFloat(amount.value)})});
  if(r.ok){item.value='';amount.value='';load()} else alert((await r.json()).error||'fail');
}
load();
</script>
</body></html>
