<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Vault CRM · StraticSoft</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">
<header class="bg-white border-b px-4 py-3 flex items-center gap-3">
  <a href="/" class="text-sm text-indigo-600">← Suite</a>
  <h1 class="font-semibold">Vault CRM</h1>
</header>
<main class="max-w-3xl mx-auto p-4 space-y-4">
  <p class="text-sm text-slate-500">Contacts private to your company. Other companies never see this list.</p>
  <div class="grid sm:grid-cols-2 gap-2">
    <input id="name" placeholder="Name *" class="rounded-xl border px-3 py-2 text-sm"/>
    <input id="email" placeholder="Email" class="rounded-xl border px-3 py-2 text-sm"/>
    <input id="phone" placeholder="Phone" class="rounded-xl border px-3 py-2 text-sm"/>
    <input id="company" placeholder="Company" class="rounded-xl border px-3 py-2 text-sm"/>
  </div>
  <textarea id="notes" rows="2" placeholder="Notes" class="w-full rounded-xl border px-3 py-2 text-sm"></textarea>
  <button onclick="add()" class="rounded-xl bg-rose-500 text-white px-4 py-2 text-sm">Add contact</button>
  <input id="q" oninput="load()" placeholder="Search…" class="w-full rounded-xl border px-3 py-2 text-sm"/>
  <div id="list" class="space-y-2"></div>
</main>
<script>
async function load(){
  const q=document.getElementById('q').value||'';
  const r=await fetch('/api/tools/vault?q='+encodeURIComponent(q));
  const j=await r.json();
  document.getElementById('list').innerHTML=(j.items||[]).map(x=>`
    <div class="bg-white border rounded-xl p-3 flex justify-between gap-2">
      <div><div class="font-medium text-sm">${esc(x.name)}</div>
      <div class="text-xs text-slate-500">${esc(x.email)} · ${esc(x.phone)}</div>
      <div class="text-xs text-slate-400">${esc(x.notes||'')}</div></div>
      <button onclick="del('${x.id}')" class="text-xs text-red-500">Delete</button>
    </div>`).join('')||'<p class="text-sm text-slate-400">No contacts yet</p>';
}
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function add(){
  const body={name:name.value,email:email.value,phone:phone.value,company:company.value,notes:notes.value};
  const r=await fetch('/api/tools/vault',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.ok){name.value=email.value=phone.value=company.value=notes.value='';load()}
  else alert((await r.json()).error||'fail');
}
async function del(id){
  await fetch('/api/tools/vault',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
  load();
}
load();
</script>
</body></html>
