<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>StraticSoft — Sign in</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{font-family:Inter,system-ui,sans-serif;background:#f8fafc}
  .card{box-shadow:0 10px 40px rgba(15,23,42,.08)}
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md card bg-white rounded-2xl border border-slate-200 p-8">
    <div class="text-center mb-6">
      <div class="inline-flex h-12 w-12 items-center justify-center rounded-xl bg-indigo-600 text-white font-bold text-lg">S</div>
      <h1 class="mt-4 text-xl font-semibold text-slate-900">StraticSoft</h1>
      <p class="text-sm text-slate-500 mt-1">Sign in with Google or email · every company has its own account</p>
    </div>

    <a href="/api/auth/google/start"
      class="flex items-center justify-center gap-3 w-full rounded-xl border border-slate-300 bg-white hover:bg-slate-50 py-3 text-sm font-medium text-slate-800 transition">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.2 6.1 29.4 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.2 6.1 29.4 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.3 26.7 36 24 36c-5.3 0-9.7-3.1-11.3-7.5l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.1-3.5 5.5-6.5 6.9l6.2 5.2C38.9 37.1 44 31.4 44 24c0-1.2-.1-2.3-.4-3.5z"/></svg>
      Continue with Google
    </a>

    <div class="flex items-center gap-3 my-6">
      <div class="flex-1 h-px bg-slate-200"></div>
      <span class="text-xs text-slate-400">or email</span>
      <div class="flex-1 h-px bg-slate-200"></div>
    </div>

    <div class="flex rounded-lg bg-slate-100 p-1 mb-6 text-sm">
      <button type="button" id="tabIn" class="flex-1 py-2 rounded-md bg-white shadow font-medium text-slate-900" onclick="showTab('in')">Sign in</button>
      <button type="button" id="tabUp" class="flex-1 py-2 rounded-md text-slate-600" onclick="showTab('up')">Register company</button>
    </div>

    <form id="formIn" onsubmit="return doLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Work email</label>
        <input id="inEmail" type="email" required autocomplete="username"
          class="w-full rounded-xl border border-slate-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
          placeholder="you@company.com"/>
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Password</label>
        <input id="inPass" type="password" required autocomplete="current-password" minlength="6"
          class="w-full rounded-xl border border-slate-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
          placeholder="••••••••"/>
      </div>
      <p id="errIn" class="text-xs text-red-600 hidden"></p>
      <button type="submit" class="w-full rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white py-3 text-sm font-semibold">Sign in</button>
    </form>

    <form id="formUp" onsubmit="return doRegister(event)" class="space-y-4 hidden">
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Company name</label>
        <input id="upCompany" type="text" required
          class="w-full rounded-xl border border-slate-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
          placeholder="Your company"/>
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Your name</label>
        <input id="upName" type="text"
          class="w-full rounded-xl border border-slate-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
          placeholder="Sahil"/>
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Work email</label>
        <input id="upEmail" type="email" required autocomplete="username"
          class="w-full rounded-xl border border-slate-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
          placeholder="you@company.com"/>
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">Password (min 6)</label>
        <input id="upPass" type="password" required minlength="6" autocomplete="new-password"
          class="w-full rounded-xl border border-slate-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
          placeholder="••••••••"/>
      </div>
      <p id="errUp" class="text-xs text-red-600 hidden"></p>
      <button type="submit" class="w-full rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white py-3 text-sm font-semibold">Create company account</button>
    </form>

    <p class="text-[11px] text-slate-400 mt-6 text-center">Google or email · each company sees only its own data</p>
  </div>
<script>
(function(){
  const e=new URLSearchParams(location.search).get('error');
  if(e){const el=document.getElementById('errIn');el.textContent='Google login failed: '+e;el.classList.remove('hidden');}
})();
function showTab(t){
  const inn=t==='in';
  document.getElementById('formIn').classList.toggle('hidden',!inn);
  document.getElementById('formUp').classList.toggle('hidden',inn);
  document.getElementById('tabIn').className=inn?'flex-1 py-2 rounded-md bg-white shadow font-medium text-slate-900':'flex-1 py-2 rounded-md text-slate-600';
  document.getElementById('tabUp').className=!inn?'flex-1 py-2 rounded-md bg-white shadow font-medium text-slate-900':'flex-1 py-2 rounded-md text-slate-600';
}
async function doLogin(e){
  e.preventDefault();
  const err=document.getElementById('errIn'); err.classList.add('hidden');
  try{
    const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:inEmail.value.trim(),password:inPass.value})});
    const j=await r.json();
    if(!r.ok){err.textContent=j.error||'Login failed';err.classList.remove('hidden');return false}
    location.href=new URLSearchParams(location.search).get('next')||'/';
  }catch(x){err.textContent='Network error';err.classList.remove('hidden')}
  return false;
}
async function doRegister(e){
  e.preventDefault();
  const err=document.getElementById('errUp'); err.classList.add('hidden');
  try{
    const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({company:upCompany.value.trim(),name:upName.value.trim(),email:upEmail.value.trim(),password:upPass.value})});
    const j=await r.json();
    if(!r.ok){err.textContent=j.error||'Register failed';err.classList.remove('hidden');return false}
    location.href='/';
  }catch(x){err.textContent='Network error';err.classList.remove('hidden')}
  return false;
}
</script>
</body>
</html>
