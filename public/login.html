<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StraticSoft Suite · Sign in</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  body{font-family:Inter,system-ui,sans-serif;background:#0b0f1a}
  .glow{box-shadow:0 0 60px rgba(99,102,241,.25)}
  .card{background:linear-gradient(165deg,#12182a 0%,#0d1220 100%);border:1px solid rgba(255,255,255,.08)}
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-white">
  <div class="w-full max-w-md card rounded-3xl p-8 glow">
    <div class="flex items-center gap-3 mb-8">
      <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center text-lg font-bold">S</div>
      <div>
        <div class="text-lg font-semibold tracking-tight">StraticSoft Suite</div>
        <div class="text-xs text-slate-400">Master hub · secure sign in</div>
      </div>
    </div>
    <h1 class="text-2xl font-semibold mb-1">Welcome back</h1>
    <p class="text-sm text-slate-400 mb-6">Sign in to open all company tools in one place.</p>
    <form id="f" class="space-y-4" onsubmit="return go(event)">
      <div>
        <label class="text-xs text-slate-400 block mb-1.5">Work email</label>
        <input id="email" type="email" required autocomplete="username"
          class="w-full rounded-xl bg-slate-900/80 border border-white/10 px-4 py-3 text-sm outline-none focus:border-indigo-500"
          placeholder="you@company.com">
      </div>
      <div>
        <label class="text-xs text-slate-400 block mb-1.5">Password</label>
        <input id="password" type="password" required autocomplete="current-password"
          class="w-full rounded-xl bg-slate-900/80 border border-white/10 px-4 py-3 text-sm outline-none focus:border-indigo-500"
          placeholder="••••••••">
      </div>
      <p id="err" class="text-xs text-red-400 hidden"></p>
      <button type="submit" class="w-full rounded-xl bg-indigo-600 hover:bg-indigo-500 py-3 text-sm font-semibold transition">
        Sign in to Suite
      </button>
    </form>
    <p class="text-[11px] text-slate-500 mt-6 text-center">StraticSoft · Login only on master · Sub-tools open without extra login</p>
  </div>
<script>
async function go(e){
  e.preventDefault();
  const err=document.getElementById('err');
  err.classList.add('hidden');
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  try{
    const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const j=await r.json();
    if(!r.ok){err.textContent=j.error||'Login failed';err.classList.remove('hidden');return false}
    const n=new URLSearchParams(location.search).get('next')||'/';
    location.href=n;
  }catch(x){err.textContent='Network error';err.classList.remove('hidden')}
  return false;
}
</script>
</body>
</html>
