<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Data → JSON · StraticSoft</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">
<header class="bg-white border-b px-4 py-3 flex items-center gap-3">
  <a href="/" class="text-sm text-indigo-600">← Suite</a>
  <h1 class="font-semibold text-slate-900">Data → JSON</h1>
</header>
<main class="max-w-3xl mx-auto p-4 space-y-4">
  <p class="text-sm text-slate-500">Paste CSV/TSV or upload a file. Converts to clean JSON (max 5000 rows). Saved under your company only.</p>
  <textarea id="txt" rows="10" class="w-full rounded-xl border border-slate-300 p-3 text-sm font-mono" placeholder="name,email,amount&#10;Rahul,rahul@x.com,500"></textarea>
  <div class="flex flex-wrap gap-2">
    <input type="file" id="file" accept=".csv,.tsv,.txt" class="text-sm"/>
    <button onclick="run()" class="rounded-xl bg-indigo-600 text-white px-4 py-2 text-sm font-medium">Convert</button>
  </div>
  <pre id="out" class="bg-slate-900 text-green-300 rounded-xl p-4 text-xs overflow-auto max-h-96 hidden"></pre>
</main>
<script>
async function run(){
  const fd=new FormData();
  const f=document.getElementById('file').files[0];
  if(f) fd.append('file',f);
  else {
    const r=await fetch('/api/tools/json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:document.getElementById('txt').value})});
    const j=await r.json();
    const o=document.getElementById('out'); o.classList.remove('hidden');
    o.textContent=r.ok?JSON.stringify(j.json,null,2):(j.error||'error');
    return;
  }
  const r=await fetch('/api/tools/json',{method:'POST',body:fd});
  const j=await r.json();
  const o=document.getElementById('out'); o.classList.remove('hidden');
  o.textContent=r.ok?JSON.stringify(j.json,null,2):(j.error||'error');
}
</script>
</body></html>
