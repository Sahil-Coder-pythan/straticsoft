<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StraticSoft Suite</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  body{font-family:Inter,system-ui,sans-serif;background:#070b14;color:#e2e8f0}
  .sidebar{background:rgba(15,20,35,.85);border-right:1px solid rgba(255,255,255,.06)}
  .topbar{background:rgba(12,16,28,.9);border-bottom:1px solid rgba(255,255,255,.06);backdrop-filter:blur(12px)}
  .app-card{background:rgba(22,28,48,.7);border:1px solid rgba(255,255,255,.07);transition:.2s}
  .app-card:hover{border-color:rgba(99,102,241,.5);transform:translateY(-2px);box-shadow:0 12px 40px rgba(0,0,0,.35)}
  .icon-box{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.25rem}
  .panel{background:rgba(18,24,40,.95);border:1px solid rgba(255,255,255,.08)}
  .nav-item.active{background:rgba(99,102,241,.15);color:#a5b4fc}
  input,textarea,select{background:#0c1220;border:1px solid rgba(255,255,255,.1);color:#e2e8f0}
  input:focus,textarea:focus{outline:none;border-color:#6366f1}
</style>
</head>
<body class="min-h-screen flex">
  <!-- Sidebar -->
  <aside class="sidebar w-56 shrink-0 hidden md:flex flex-col min-h-screen sticky top-0">
    <div class="p-4 flex items-center gap-2 border-b border-white/5">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center text-xs font-bold">S</div>
      <span class="font-semibold text-sm">StraticSoft</span>
    </div>
    <nav class="p-3 space-y-1 text-sm text-slate-400 flex-1">
      <button type="button" onclick="showHome()" class="nav-item active w-full text-left px-3 py-2 rounded-lg flex items-center gap-2"><i class="fas fa-home w-4"></i> Home</button>
      <button type="button" onclick="showHome()" class="nav-item w-full text-left px-3 py-2 rounded-lg flex items-center gap-2 text-indigo-300"><i class="fas fa-grip w-4"></i> Apps</button>
      <div class="pt-4 text-[10px] uppercase tracking-wider text-slate-600 px-3">Tools</div>
      <button type="button" onclick="openApp('datajson')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-white/5 flex items-center gap-2"><i class="fas fa-file-code w-4"></i> Data JSON</button>
      <button type="button" onclick="openApp('vault')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-white/5 flex items-center gap-2"><i class="fas fa-shield-halved w-4"></i> Vault</button>
      <button type="button" onclick="openApp('analytics')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-white/5 flex items-center gap-2"><i class="fas fa-chart-column w-4"></i> Analytics</button>
    </nav>
    <div class="p-3 border-t border-white/5 flex gap-2 text-slate-500 text-sm">
      <button type="button" onclick="logout()" title="Sign out" class="p-2 hover:text-white"><i class="fas fa-right-from-bracket"></i></button>
    </div>
  </aside>

  <div class="flex-1 flex flex-col min-w-0">
    <!-- Top bar -->
    <header class="topbar sticky top-0 z-20 px-4 py-3 flex items-center gap-3">
      <button type="button" class="md:hidden p-2" onclick="document.querySelector('aside').classList.toggle('hidden')"><i class="fas fa-bars"></i></button>
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center text-[10px] font-bold">S</div>
        <span class="font-semibold text-sm hidden sm:inline">StraticSoft Suite</span>
        <i class="fas fa-chevron-down text-[10px] text-slate-500"></i>
      </div>
      <div class="flex-1 max-w-xl mx-auto">
        <div class="relative">
          <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
          <input id="search" type="search" placeholder="Search for apps, files, people..."
            class="w-full rounded-full pl-9 pr-4 py-2 text-sm bg-slate-900/80 border border-white/10"
            oninput="filterApps()">
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span class="w-8 h-8 rounded-full bg-violet-600 flex items-center justify-center text-xs font-bold" id="avatar">S</span>
      </div>
    </header>

    <main class="flex-1 p-4 md:p-8">
      <!-- Home grid -->
      <section id="view-home">
        <h1 class="text-2xl md:text-3xl font-semibold mb-1">StraticSoft Suite</h1>
        <p class="text-slate-400 text-sm mb-6">Your central hub — access all tools and apps in one place</p>
        <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        <p class="text-[11px] text-slate-600 mt-6">All apps · StraticSoft · Updated just now</p>
      </section>

      <!-- Tool panels -->
      <section id="view-tool" class="hidden max-w-3xl">
        <button type="button" onclick="showHome()" class="text-sm text-indigo-400 mb-4"><i class="fas fa-arrow-left mr-1"></i> Back to apps</button>
        <div id="toolBody" class="panel rounded-2xl p-5"></div>
      </section>
    </main>
  </div>

<script>
let APPS = [];
let USER = null;

async function boot(){
  const me = await fetch('/api/auth/me');
  if(!me.ok){ location.href='/login'; return; }
  const mj = await me.json();
  USER = mj.user;
  document.getElementById('avatar').textContent = (USER.name||USER.email||'S')[0].toUpperCase();
  const r = await fetch('/api/suite/apps');
  const j = await r.json();
  APPS = j.apps || [];
  renderGrid(APPS);
  // deep link /app/id
  const m = location.pathname.match(/^\/app\/([a-z0-9]+)/);
  if(m) openApp(m[1]);
}

function renderGrid(list){
  const g = document.getElementById('grid');
  g.innerHTML = list.map(a => `
    <button type="button" onclick='launch(${JSON.stringify(a.id)})'
      class="app-card rounded-2xl p-5 text-left w-full">
      <div class="icon-box mb-3" style="background:${a.color}22;color:${a.color}">
        <i class="fas ${a.icon}"></i>
      </div>
      <div class="font-semibold">${a.name}</div>
      <div class="text-xs text-slate-400 mt-0.5">${a.tag}</div>
      ${!a.ready && a.type==='external' ? '<div class="text-[10px] text-amber-400 mt-2">Set URL in env</div>' : ''}
    </button>
  `).join('');
}

function filterApps(){
  const q = (document.getElementById('search').value||'').toLowerCase();
  renderGrid(APPS.filter(a => !q || a.name.toLowerCase().includes(q) || a.tag.toLowerCase().includes(q) || (a.desc||'').toLowerCase().includes(q)));
}

function showHome(){
  document.getElementById('view-home').classList.remove('hidden');
  document.getElementById('view-tool').classList.add('hidden');
  history.replaceState({}, '', '/');
}

async function launch(id){
  const a = APPS.find(x => x.id === id);
  if(!a) return;
  if(a.type === 'embedded' || a.type === 'external'){
    if(!a.url){ alert(a.name+' not mounted'); return; }
    // same deployment — full tool UI in this tab
    location.href = a.url;
    return;
  }
  openApp(id);
}

function openApp(id){
  document.getElementById('view-home').classList.add('hidden');
  document.getElementById('view-tool').classList.remove('hidden');
  history.replaceState({}, '', '/app/'+id);
  const body = document.getElementById('toolBody');
  const map = {datajson: uiDataJson, vault: uiVault, dukan: uiDukan, analytics: uiAnalytics, connect: uiConnect, billing: uiBilling};
  (map[id]||(()=>body.innerHTML='<p>Unknown app</p>'))(body);
}

async function logout(){
  await fetch('/api/auth/logout',{method:'POST'});
  location.href='/login';
}

function uiDataJson(el){
  el.innerHTML = `
    <h2 class="text-xl font-semibold mb-1">Data JSON</h2>
    <p class="text-xs text-slate-400 mb-4">Paste CSV or text → enterprise JSON in one click. StraticSoft.</p>
    <textarea id="djIn" rows="8" class="w-full rounded-xl p-3 text-sm font-mono mb-3" placeholder="name,email,amount&#10;Aarav,a@x.com,8500&#10;..."></textarea>
    <button type="button" onclick="runDataJson()" class="bg-cyan-600 hover:bg-cyan-500 px-4 py-2 rounded-xl text-sm font-medium">Convert to JSON</button>
    <pre id="djOut" class="mt-4 text-xs bg-black/40 rounded-xl p-4 overflow-auto max-h-96 text-cyan-100"></pre>`;
}
async function runDataJson(){
  const text = document.getElementById('djIn').value;
  const r = await fetch('/api/tools/datajson',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
  const j = await r.json();
  document.getElementById('djOut').textContent = j.pretty || j.error || JSON.stringify(j,null,2);
}

function uiVault(el){
  el.innerHTML = `
    <h2 class="text-xl font-semibold mb-1">Vault CRM</h2>
    <p class="text-xs text-slate-400 mb-4">Contacts & leads · this suite only</p>
    <div class="grid sm:grid-cols-2 gap-2 mb-3">
      <input id="vName" placeholder="Name" class="rounded-xl px-3 py-2 text-sm">
      <input id="vEmail" placeholder="Email" class="rounded-xl px-3 py-2 text-sm">
      <input id="vPhone" placeholder="Phone" class="rounded-xl px-3 py-2 text-sm">
      <input id="vCo" placeholder="Company" class="rounded-xl px-3 py-2 text-sm">
    </div>
    <button type="button" onclick="addVault()" class="bg-teal-600 hover:bg-teal-500 px-4 py-2 rounded-xl text-sm mb-4">Add contact</button>
    <div id="vList" class="space-y-2 text-sm"></div>`;
  loadVault();
}
async function loadVault(){
  const r = await fetch('/api/tools/vault'); const j = await r.json();
  document.getElementById('vList').innerHTML = (j.contacts||[]).map(c=>`
    <div class="flex justify-between items-center border border-white/5 rounded-xl px-3 py-2">
      <div><div class="font-medium">${esc(c.name)}</div><div class="text-xs text-slate-400">${esc(c.email)} · ${esc(c.company)}</div></div>
      <button type="button" class="text-red-400 text-xs" onclick="delVault('${c.id}')">Delete</button>
    </div>`).join('') || '<p class="text-slate-500 text-xs">No contacts yet</p>';
}
async function addVault(){
  const body={name:vName.value,email:vEmail.value,phone:vPhone.value,company:vCo.value};
  await fetch('/api/tools/vault',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  loadVault();
}
async function delVault(id){
  await fetch('/api/tools/vault',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
  loadVault();
}

function uiDukan(el){
  el.innerHTML = `
    <h2 class="text-xl font-semibold mb-1">Dukan Hisab</h2>
    <p class="text-xs text-slate-400 mb-4">Simple POS · sales tally</p>
    <div class="flex flex-wrap gap-2 mb-3">
      <input id="dItem" placeholder="Item" class="rounded-xl px-3 py-2 text-sm flex-1 min-w-[120px]">
      <input id="dAmt" type="number" step="0.01" placeholder="Amount" class="rounded-xl px-3 py-2 text-sm w-28">
      <button type="button" onclick="addSale()" class="bg-orange-600 hover:bg-orange-500 px-4 py-2 rounded-xl text-sm">Add sale</button>
    </div>
    <p class="text-sm mb-2">Total: ₹<span id="dTotal">0</span></p>
    <div id="dList" class="space-y-1 text-sm max-h-80 overflow-auto"></div>`;
  loadDukan();
}
async function loadDukan(){
  const r=await fetch('/api/tools/dukan'); const j=await r.json();
  document.getElementById('dTotal').textContent=j.total;
  document.getElementById('dList').innerHTML=(j.sales||[]).map(s=>
    `<div class="border border-white/5 rounded-lg px-3 py-1.5 flex justify-between"><span>${esc(s.item)}</span><span>₹${s.amount}</span></div>`
  ).join('');
}
async function addSale(){
  await fetch('/api/tools/dukan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({item:dItem.value,amount:dAmt.value})});
  loadDukan();
}

function uiAnalytics(el){
  el.innerHTML=`<h2 class="text-xl font-semibold mb-4">Analytics</h2><div id="aBox" class="grid grid-cols-2 gap-3 text-sm"></div>`;
  fetch('/api/tools/analytics').then(r=>r.json()).then(j=>{
    const m=j.metrics||{};
    document.getElementById('aBox').innerHTML=Object.entries(m).map(([k,v])=>
      `<div class="panel rounded-xl p-4"><div class="text-xs text-slate-400">${k.replace(/_/g,' ')}</div><div class="text-xl font-semibold mt-1">${v}</div></div>`
    ).join('');
  });
}

function uiConnect(el){
  el.innerHTML=`
    <h2 class="text-xl font-semibold mb-1">Connect</h2>
    <p class="text-xs text-slate-400 mb-4">Save HTTPS webhooks (Slack, custom, etc.)</p>
    <input id="cUrl" placeholder="https://hooks.slack.com/..." class="w-full rounded-xl px-3 py-2 text-sm mb-2">
    <input id="cCh" placeholder="Channel name" class="w-full rounded-xl px-3 py-2 text-sm mb-2">
    <button type="button" onclick="addHook()" class="bg-violet-600 px-4 py-2 rounded-xl text-sm mb-4">Save webhook</button>
    <div id="cList" class="text-sm space-y-2"></div>`;
  loadHooks();
}
async function loadHooks(){
  const r=await fetch('/api/tools/connect'); const j=await r.json();
  document.getElementById('cList').innerHTML=(j.hooks||[]).map(h=>
    `<div class="flex justify-between border border-white/5 rounded-xl px-3 py-2"><span class="truncate text-xs">${esc(h.channel)} · ${esc(h.url)}</span>
     <button type="button" class="text-red-400 text-xs" onclick="delHook('${h.id}')">×</button></div>`
  ).join('')||'<p class="text-slate-500 text-xs">None yet</p>';
}
async function addHook(){
  await fetch('/api/tools/connect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:cUrl.value,channel:cCh.value})});
  loadHooks();
}
async function delHook(id){
  await fetch('/api/tools/connect',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
  loadHooks();
}

function uiBilling(el){
  el.innerHTML=`
    <h2 class="text-xl font-semibold mb-1">Billing</h2>
    <p class="text-xs text-slate-400 mb-4">Plan notes & draft invoices (no fake bank charges)</p>
    <div id="bPlan" class="panel rounded-xl p-4 mb-4 text-sm"></div>
    <div class="flex gap-2 mb-3">
      <input id="bLabel" placeholder="Invoice label" class="rounded-xl px-3 py-2 text-sm flex-1">
      <input id="bAmt" type="number" placeholder="USD" class="rounded-xl px-3 py-2 text-sm w-24">
      <button type="button" onclick="addInv()" class="bg-emerald-600 px-4 py-2 rounded-xl text-sm">Add draft</button>
    </div>
    <div id="bList" class="text-sm space-y-1"></div>`;
  loadBill();
}
async function loadBill(){
  const r=await fetch('/api/tools/billing'); const j=await r.json();
  const p=j.plan||{};
  document.getElementById('bPlan').innerHTML=`Plan: <b>${esc(p.name)}</b> · $${p.price_usd||0}/mo · ${esc(p.status)}`;
  document.getElementById('bList').innerHTML=(j.invoices||[]).map(i=>
    `<div class="border border-white/5 rounded-lg px-3 py-1.5 flex justify-between"><span>${esc(i.label)}</span><span>$${i.amount_usd} · ${i.status}</span></div>`
  ).join('');
}
async function addInv(){
  await fetch('/api/tools/billing',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({label:bLabel.value,amount_usd:bAmt.value})});
  loadBill();
}

function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
boot();
</script>
</body>
</html>
