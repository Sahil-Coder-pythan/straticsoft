<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>StraticSoft Suite</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{font-family:Inter,system-ui,sans-serif;background:#f1f5f9}
  .app-card{transition:transform .15s,box-shadow .15s}
  .app-card:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(15,23,42,.08)}
  .sidebar a.active{background:#e0e7ff;color:#3730a3}
</style>
</head>
<body class="min-h-screen flex">
  <!-- Sidebar -->
  <aside id="sidebar" class="hidden md:flex w-56 flex-col bg-white border-r border-slate-200 min-h-screen">
    <div class="p-4 border-b border-slate-100 flex items-center gap-2">
      <div class="h-9 w-9 rounded-lg bg-indigo-600 text-white flex items-center justify-center font-bold">S</div>
      <div>
        <div class="text-sm font-semibold text-slate-900">StraticSoft</div>
        <div class="text-[10px] text-slate-400">Enterprise Suite</div>
      </div>
    </div>
    <nav class="flex-1 p-3 space-y-1 text-sm sidebar">
      <a href="/" class="active flex items-center gap-2 px-3 py-2 rounded-lg text-slate-700">Apps</a>
      <a href="/tools/json" class="flex items-center gap-2 px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-50">Data → JSON</a>
      <a href="/tools/vault" class="flex items-center gap-2 px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-50">Vault CRM</a>
      <a href="/tools/pos" class="flex items-center gap-2 px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-50">Dukan Hisab</a>
      <a href="/tools/analytics" class="flex items-center gap-2 px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-50">Analytics</a>
      <a href="/tools/connect" class="flex items-center gap-2 px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-50">Connect</a>
      <a href="/tools/billing" class="flex items-center gap-2 px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-50">Billing</a>
      <div class="pt-3 mt-3 border-t border-slate-100 text-[10px] uppercase tracking-wide text-slate-400 px-3">Core engines</div>
      <a href="/resolle/" class="flex items-center gap-2 px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-50">Resolle Support</a>
      <a href="/forge/" class="flex items-center gap-2 px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-50">Forge Builder</a>
      <a href="/router/" class="flex items-center gap-2 px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-50">AI Router</a>
    </nav>
    <div class="p-3 border-t border-slate-100 text-xs text-slate-500">
      <div id="sideUser" class="font-medium text-slate-700 truncate">—</div>
      <div id="sideCo" class="truncate text-slate-400">—</div>
      <button onclick="logout()" class="mt-2 text-indigo-600 hover:underline">Sign out</button>
    </div>
  </aside>

  <!-- Main -->
  <div class="flex-1 flex flex-col min-w-0">
    <header class="bg-white border-b border-slate-200 px-4 py-3 flex items-center gap-3">
      <button class="md:hidden p-2 rounded-lg hover:bg-slate-100" onclick="document.getElementById('sidebar').classList.toggle('hidden')">☰</button>
      <div class="flex-1 relative max-w-xl">
        <input id="search" type="search" placeholder="Search apps…"
          class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
          oninput="filterApps()"/>
      </div>
      <div class="hidden sm:flex items-center gap-2 text-sm text-slate-600">
        <span id="topName" class="font-medium">…</span>
        <span id="avatar" class="h-8 w-8 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center font-semibold text-xs">S</span>
      </div>
    </header>

    <main class="p-4 md:p-8 max-w-6xl mx-auto w-full">
      <h1 class="text-2xl font-semibold text-slate-900 mb-1">Apps</h1>
      <p class="text-sm text-slate-500 mb-6">One suite · your company data stays private · open any tool</p>

      <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- cards injected -->
      </div>
    </main>
  </div>

<script>
const APPS = [
  {id:'resolle', name:'Resolle Support', desc:'Refund · tickets · Salesforce/Zendesk connect · agent desk · CEO ROI', href:'/resolle/', tag:'Core', color:'bg-violet-500'},
  {id:'forge', name:'Forge Builder', desc:'AI app builder · chat · generate internal tools fast', href:'/forge/', tag:'Core', color:'bg-sky-500'},
  {id:'router', name:'AI Router', desc:'Route prompts to the right model · cost control', href:'/router/', tag:'Core', color:'bg-emerald-500'},
  {id:'json', name:'Data → JSON', desc:'CSV/TSV → clean JSON in one click (up to 5k rows)', href:'/tools/json', tag:'Data', color:'bg-amber-500'},
  {id:'vault', name:'Vault CRM', desc:'Contacts · notes · search — isolated per company', href:'/tools/vault', tag:'CRM', color:'bg-rose-500'},
  {id:'pos', name:'Dukan Hisab', desc:'Quick POS sales · daily total · simple ledger', href:'/tools/pos', tag:'Sales', color:'bg-orange-500'},
  {id:'analytics', name:'Analytics', desc:'Live snapshot of your suite activity', href:'/tools/analytics', tag:'Insight', color:'bg-indigo-500'},
  {id:'connect', name:'Connect Board', desc:'Store integration keys · status per system', href:'/tools/connect', tag:'Ops', color:'bg-teal-500'},
  {id:'billing', name:'Billing & Plan', desc:'Trial / Enterprise plan · pause warning', href:'/tools/billing', tag:'Admin', color:'bg-slate-600'},
];

function render(list){
  const g=document.getElementById('grid');
  g.innerHTML=list.map(a=>`
    <a href="${a.href}" class="app-card block bg-white rounded-2xl border border-slate-200 p-5">
      <div class="flex items-start gap-3">
        <div class="h-11 w-11 rounded-xl ${a.color} text-white flex items-center justify-center font-bold text-sm">${a.name.slice(0,2).toUpperCase()}</div>
        <div class="min-w-0">
          <div class="font-semibold text-slate-900">${a.name}</div>
          <div class="text-xs text-slate-500 mt-1 leading-relaxed">${a.desc}</div>
          <span class="inline-block mt-2 text-[10px] uppercase tracking-wide text-slate-400">${a.tag}</span>
        </div>
      </div>
    </a>`).join('');
}
function filterApps(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  render(APPS.filter(a=>!q||a.name.toLowerCase().includes(q)||a.desc.toLowerCase().includes(q)||a.tag.toLowerCase().includes(q)));
}
async function boot(){
  try{
    const r=await fetch('/api/auth/me');
    if(!r.ok){location.href='/login';return}
    const j=await r.json();
    const u=j.user||{};
    document.getElementById('topName').textContent=u.name||u.email||'';
    document.getElementById('sideUser').textContent=u.name||u.email||'';
    document.getElementById('sideCo').textContent=u.company||u.company_id||'';
    const ch=(u.name||u.email||'S')[0].toUpperCase();
    document.getElementById('avatar').textContent=ch;
  }catch(e){location.href='/login'}
  render(APPS);
}
async function logout(){
  await fetch('/api/auth/logout',{method:'POST'});
  location.href='/login';
}
boot();
</script>
</body>
</html>
