<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Billing · StraticSoft</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">
<header class="bg-white border-b px-4 py-3 flex items-center gap-3">
  <a href="/" class="text-sm text-indigo-600">← Suite</a>
  <h1 class="font-semibold">Billing & Plan</h1>
</header>
<main class="max-w-md mx-auto p-4">
  <div class="bg-white border rounded-2xl p-6 space-y-3">
    <div class="text-xs text-slate-500">Company</div>
    <div id="co" class="font-medium"></div>
    <div class="text-xs text-slate-500">Plan</div>
    <div id="plan" class="text-2xl font-semibold"></div>
    <div id="note" class="text-sm text-slate-500"></div>
    <div class="flex gap-2 pt-2">
      <button onclick="act('upgrade')" class="flex-1 rounded-xl bg-indigo-600 text-white py-2 text-sm">Enterprise $1,200/mo</button>
      <button onclick="act('downgrade')" class="flex-1 rounded-xl border border-slate-300 py-2 text-sm">Pause</button>
    </div>
  </div>
</main>
<script>
async function load(){
  const r=await fetch('/api/tools/billing'); const j=await r.json();
  document.getElementById('co').textContent=j.company||'';
  document.getElementById('plan').textContent=(j.billing.plan||'')+(j.billing.active?' · Active':' · Off');
  document.getElementById('note').textContent=j.billing.note||'';
}
async function act(action){
  if(action==='downgrade' && !confirm('Pause removes automation efficiency. Staff return to full manual load. Continue?')) return;
  await fetch('/api/tools/billing',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})});
  load();
}
load();
</script>
</body></html>
