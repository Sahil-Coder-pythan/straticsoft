
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ChatXON Mind</title>

<meta name="author" content="Sahil">

<meta name="description"
content="ChatXON Mind - AI Assistant by Sahil">

<style>

:root {

  --bg: #0f0f13;
  --sidebar-bg: #16161c;
  --card: #1c1c24;
  --border: #2a2a35;

  --text: #ececf1;
  --text-muted: #8b8b9a;

  --accent: #7c5cff;
  --accent-hover: #6a4de0;

  --user-bubble: #2a2a35;
  --ai-bubble: #1c1c24;

}

* {

  box-sizing: border-box;
  margin: 0;
  padding: 0;

}

body {

  background: var(--bg);
  color: var(--text);

  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "Segoe UI",
  Roboto,
  Helvetica,
  Arial,
  sans-serif;

  height: 100vh;
  overflow: hidden;

}

.app {

  display: flex;
  height: 100dvh;

}


/* SIDEBAR */

.sidebar {

  width: 260px;

  background: var(--sidebar-bg);

  border-right: 1px solid var(--border);

  display: flex;
  flex-direction: column;

  flex-shrink: 0;

  transition: transform 0.25s ease;

}

.sidebar-header {

  padding: 16px;

  border-bottom:
  1px solid var(--border);

}

.new-chat-btn {

  width: 100%;

  background: var(--accent);

  color: white;

  border: none;

  border-radius: 10px;

  padding: 11px 14px;

  font-size: 14px;

  font-weight: 500;

  cursor: pointer;

  display: flex;

  align-items: center;
  justify-content: center;

  gap: 8px;

}

.new-chat-btn:hover {

  background:
  var(--accent-hover);

}

.chat-list {

  flex: 1;

  overflow-y: auto;

  padding: 10px;

}

.chat-item {

  padding: 12px 14px;

  border-radius: 10px;

  cursor: pointer;

  font-size: 13.5px;

  margin-bottom: 3px;

  color: var(--text-muted);

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

}

.chat-item:hover {

  background: #22222b;

  color: var(--text);

}

.chat-item.active {

  background: #2a2a35;

  color: var(--text);

}

.chat-item .time {

  font-size: 11px;

  color: #555;

  margin-top: 3px;

}


/* MAIN */

.main {

  flex: 1;

  display: flex;

  flex-direction: column;

  min-width: 0;

  position: relative;

}

.topbar {

  height: 56px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding: 0 16px;

  border-bottom:
  1px solid var(--border);

  background: var(--bg);

  gap: 12px;

}

.topbar-left {

  display: flex;

  align-items: center;

  gap: 12px;

}

.topbar-right {

  font-size: 12px;

  color: var(--accent);

  font-weight: 600;

  letter-spacing: 0.3px;

}

.menu-btn {

  display: none;

  background: none;

  border: none;

  color: var(--text);

  font-size: 22px;

  cursor: pointer;

  padding: 4px 8px;

}

.brand {

  display: flex;

  align-items: center;

  gap: 10px;

}

.logo {

  width: 32px;
  height: 32px;

  border-radius: 9px;

  background:
  linear-gradient(
    135deg,
    #7c5cff,
    #4f46e5
  );

  display: flex;

  align-items: center;
  justify-content: center;

  font-weight: 700;

  font-size: 14px;

  color: white;

}

.brand-name {

  font-size: 15px;

  font-weight: 600;

}


/* CHAT */

.chat {

  flex: 1;

  overflow-y: auto;

  padding:
  24px 16px 140px;

  scroll-behavior: smooth;

}

.message {

  display: flex;

  width: 100%;

  margin-bottom: 20px;

}

.message.user {

  justify-content: flex-end;

}

.message.ai {

  justify-content: flex-start;

}

.bubble {

  max-width:
  min(720px, 85%);

  padding:
  12px 16px;

  border-radius: 16px;

  line-height: 1.6;

  font-size: 15px;

  white-space: pre-wrap;

  word-wrap: break-word;

}

.user .bubble {

  background:
  var(--user-bubble);

  border-bottom-right-radius: 4px;

}

.ai .bubble {

  background:
  var(--ai-bubble);

  border:
  1px solid var(--border);

  border-bottom-left-radius: 4px;

}

.ai-label {

  font-size: 11px;

  color:
  var(--text-muted);

  margin-bottom: 5px;

  letter-spacing: 0.4px;

  font-weight: 500;

}


/* WELCOME */

.welcome {

  height: 100%;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  text-align: center;

  padding: 20px;

  color:
  var(--text-muted);

}

.welcome-logo {

  width: 56px;
  height: 56px;

  border-radius: 16px;

  background:
  linear-gradient(
    135deg,
    #7c5cff,
    #4f46e5
  );

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 24px;

  font-weight: 700;

  color: white;

  margin-bottom: 20px;

}

.welcome h1 {

  font-size: 22px;

  font-weight: 600;

  color: var(--text);

  margin-bottom: 8px;

}

.welcome p {

  font-size: 15px;

  max-width: 360px;

  line-height: 1.5;

}


/* THINKING */

.thinking {

  display: flex;

  align-items: center;

  gap: 5px;

  padding: 14px 16px;

  background:
  var(--ai-bubble);

  border:
  1px solid var(--border);

  border-radius: 16px;

  width: max-content;

}

.dot {

  width: 6px;
  height: 6px;

  background: #888;

  border-radius: 50%;

  animation:
  blink 1.2s infinite;

}

.dot:nth-child(2) {

  animation-delay: 0.2s;

}

.dot:nth-child(3) {

  animation-delay: 0.4s;

}

@keyframes blink {

  0%, 100% {

    opacity: 0.3;

    transform:
    translateY(0);

  }

  50% {

    opacity: 1;

    transform:
    translateY(-3px);

  }

}


/* INPUT */

.input-area {

  position: absolute;

  left: 0;
  right: 0;
  bottom: 0;

  padding:
  12px 16px 20px;

  background:
  linear-gradient(
    transparent,
    var(--bg) 30%
  );

}

.input-box {

  max-width: 780px;

  margin: 0 auto;

  background:
  var(--card);

  border:
  1px solid var(--border);

  border-radius: 16px;

  display: flex;

  align-items: center;

  padding:
  8px 10px 8px 8px;

  gap: 6px;

  box-shadow:
  0 4px 24px
  rgba(0,0,0,0.3);

}

#question {

  flex: 1;

  background: transparent;

  border: none;

  outline: none;

  color: var(--text);

  font-size: 15px;

  min-width: 0;

}

#question::placeholder {

  color: #666;

}

.send {

  width: 40px;
  height: 40px;

  border: none;

  border-radius: 12px;

  background:
  var(--accent);

  color: white;

  font-size: 18px;

  cursor: pointer;

  display: flex;

  align-items: center;

  justify-content: center;

}

.send:hover {

  background:
  var(--accent-hover);

}

.send:disabled {

  opacity: 0.4;

  cursor: not-allowed;

}

.attach-btn {

  width: 36px;
  height: 36px;

  border: none;

  border-radius: 10px;

  background: transparent;

  color: var(--text-muted);

  font-size: 22px;

  font-weight: 400;

  cursor: pointer;

  display: flex;

  align-items: center;

  justify-content: center;

  flex-shrink: 0;

  transition: background 0.15s, color 0.15s;

}

.attach-btn:hover {

  background: #2a2a35;

  color: var(--text);

}

.attach-preview {

  max-width: 780px;

  margin: 0 auto 10px;

  display: flex;

  flex-wrap: wrap;

  gap: 8px;

  padding: 0 4px;

}

.attach-item {

  position: relative;

  width: 72px;

  height: 72px;

  border-radius: 10px;

  overflow: hidden;

  background: var(--card);

  border: 1px solid var(--border);

  flex-shrink: 0;

}

.attach-item img {

  width: 100%;

  height: 100%;

  object-fit: cover;

}

.attach-item .file-icon {

  width: 100%;

  height: 100%;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 11px;

  color: var(--text-muted);

  text-align: center;

  padding: 4px;

  word-break: break-all;

}

.attach-item .remove-btn {

  position: absolute;

  top: 2px;

  right: 2px;

  width: 20px;

  height: 20px;

  border-radius: 50%;

  background: rgba(0,0,0,0.7);

  color: white;

  border: none;

  font-size: 12px;

  cursor: pointer;

  display: flex;

  align-items: center;

  justify-content: center;

  line-height: 1;

}

.attach-item .remove-btn:hover {

  background: #e11;

}


/* OVERLAY */

.overlay {

  display: none;

  position: fixed;

  inset: 0;

  background:
  rgba(0,0,0,0.5);

  z-index: 20;

}


/* MOBILE */

@media (max-width: 768px) {

  .sidebar {

    position: fixed;

    left: 0;
    top: 0;
    bottom: 0;

    z-index: 30;

    transform:
    translateX(-100%);

  }

  .sidebar.open {

    transform:
    translateX(0);

  }

  .menu-btn {

    display: block;

  }

  .overlay.show {

    display: block;

  }

}


/* SCROLLBAR */

.chat::-webkit-scrollbar,
.chat-list::-webkit-scrollbar {

  width: 5px;

}

.chat::-webkit-scrollbar-thumb,
.chat-list::-webkit-scrollbar-thumb {

  background: #333;

  border-radius: 10px;

}

</style>

</head>

<body>

<div class="app">

  <div class="sidebar" id="sidebar">

    <div class="sidebar-header">

      <button
        class="new-chat-btn"
        onclick="createNewChat()">

        + New Chat

      </button>

    </div>

    <div
      class="chat-list"
      id="chatList">
    </div>

  </div>


  <div
    class="overlay"
    id="overlay"
    onclick="closeSidebar()">
  </div>


  <div class="main">

    <div class="topbar">

      <div class="topbar-left">
        <button
          class="menu-btn"
          onclick="toggleSidebar()">

          ☰

        </button>

        <div class="brand">

          <div class="logo">
            X
          </div>

          <div class="brand-name">
            ChatXON Mind
          </div>

        </div>
      </div>

      <div class="topbar-right">
        Sahil • Founder & CEO
      </div>

    </div>


    <div
      id="chat"
      class="chat">
    </div>


    <div class="input-area">

      <div id="attachPreview" class="attach-preview" style="display:none;"></div>

      <div class="input-box">

        <button
          id="attachBtn"
          class="attach-btn"
          type="button"
          title="Attach photo / file"
          onclick="document.getElementById('fileInput').click()">
          +
        </button>

        <input
          type="file"
          id="fileInput"
          accept="image/*,.pdf,.txt,.doc,.docx,.csv,.json"
          multiple
          style="display:none;"
          onchange="handleFileSelect(event)">

        <input
          id="question"
          type="text"
          placeholder="Message ChatXON Mind..."
          autocomplete="off">

        <button
          id="send"
          class="send"
          onclick="sendMessage()">

          ↑

        </button>

      </div>

    </div>

  </div>

</div>


<script>

const chat =
document.getElementById("chat");

const question =
document.getElementById("question");

const sendBtn =
document.getElementById("send");

const chatList =
document.getElementById("chatList");

const sidebar =
document.getElementById("sidebar");

const overlay =
document.getElementById("overlay");


let currentChatId = null;

// Attached files for current message (images / docs)
let attachedFiles = [];


/* ==========================================
   UNIQUE USER ID
   ========================================== */

function getUserId() {

  let id =
    localStorage.getItem(
      "chatxon_user_id"
    );

  if (!id) {

    id =
      crypto.randomUUID();

    localStorage.setItem(
      "chatxon_user_id",
      id
    );

  }

  return id;

}


/* ==========================================
   SIDEBAR
   ========================================== */

function toggleSidebar() {

  sidebar.classList.toggle("open");

  overlay.classList.toggle("show");

}


function closeSidebar() {

  sidebar.classList.remove("open");

  overlay.classList.remove("show");

}


/* ==========================================
   SCROLL
   ========================================== */

function scrollToBottom() {

  setTimeout(() => {

    chat.scrollTo({

      top: chat.scrollHeight,

      behavior: "smooth"

    });

  }, 40);

}


/* ==========================================
   CHAT UI
   ========================================== */

function clearChat() {

  chat.innerHTML = "";

}


function showWelcome() {

  clearChat();

  chat.innerHTML = `

    <div class="welcome">

      <div class="welcome-logo">
        X
      </div>

      <h1>
        Welcome, Sahil CEO
      </h1>

      <p style="color: var(--accent); font-weight: 500; font-size: 13px; margin-bottom: 12px; letter-spacing: 0.5px; text-transform: uppercase;">
        StratisSoft Executive Suite
      </p>

      <p>
        How can I assist you today?
      </p>

    </div>

  `;

}


function addMessage(text, type, images) {

  const welcome =
    chat.querySelector(".welcome");

  if (welcome) {

    welcome.remove();

  }


  const div =
    document.createElement("div");

  div.className =
    `message ${type}`;


  if (type === "ai") {

    div.innerHTML = `

      <div>

        <div class="ai-label">
          CHATXON MIND
        </div>

        <div class="bubble">
        </div>

      </div>

    `;

  } else {

    div.innerHTML = `

      <div class="bubble">
      </div>

    `;

  }


  const bubble = div.querySelector(".bubble");

  if (images && images.length > 0) {
    const imgWrap = document.createElement("div");
    imgWrap.style.cssText = "display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;";
    images.forEach(function(src) {
      if (src && src.startsWith("data:image")) {
        const img = document.createElement("img");
        img.src = src;
        img.style.cssText = "max-width:180px;max-height:140px;border-radius:10px;object-fit:cover;";
        imgWrap.appendChild(img);
      } else if (src) {
        const span = document.createElement("span");
        span.textContent = "📎 " + (src.name || "File");
        span.style.cssText = "font-size:12px;color:var(--text-muted);padding:4px 8px;background:#222;border-radius:6px;";
        imgWrap.appendChild(span);
      }
    });
    bubble.appendChild(imgWrap);
  }

  if (text) {
    const textNode = document.createElement("div");
    textNode.textContent = text;
    bubble.appendChild(textNode);
  }


  chat.appendChild(div);

  scrollToBottom();

}


/* ==========================================
   THINKING
   ========================================== */

function showThinking() {

  const div =
    document.createElement("div");

  div.id = "thinking";

  div.className =
    "message ai";


  div.innerHTML = `

    <div>

      <div class="ai-label">
        CHATXON MIND
      </div>

      <div class="thinking">

        <span class="dot"></span>

        <span class="dot"></span>

        <span class="dot"></span>

      </div>

    </div>

  `;


  chat.appendChild(div);

  scrollToBottom();

}


function removeThinking() {

  const el =
    document.getElementById(
      "thinking"
    );

  if (el) {

    el.remove();

  }

}


/* ==========================================
   LOAD CHAT LIST
   ========================================== */

async function loadChatList() {

  try {

    const res =
      await fetch("/get_chats", {

        method: "POST",

        headers: {

          "Content-Type":
          "application/json"

        },

        body: JSON.stringify({

          user_id:
          getUserId()

        })

      });


    const data =
      await res.json();


    renderChatList(
      data.chats || []
    );


  } catch (e) {

    console.error(e);

  }

}


/* ==========================================
   RENDER CHAT LIST
   ========================================== */

function renderChatList(chats) {

  chatList.innerHTML = "";


  if (chats.length === 0) {

    chatList.innerHTML = `

      <div
        style="
        padding:24px;
        text-align:center;
        color:#555;
        font-size:13px;">

        No conversations yet

      </div>

    `;

    return;

  }


  chats.forEach(c => {

    const item =
      document.createElement("div");


    item.className =
      "chat-item" +
      (
        c.chat_id === currentChatId
        ? " active"
        : ""
      );


    item.innerHTML = `

      <div>
        ${escapeHtml(
          c.title || "New Chat"
        )}
      </div>

      <div class="time">
        ${escapeHtml(
          c.updated_at || ""
        )}
      </div>

    `;


    item.onclick = () =>
      loadChat(c.chat_id);


    chatList.appendChild(item);

  });

}


/* ==========================================
   HTML ESCAPE
   ========================================== */

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;

}


/* ==========================================
   LOAD PARTICULAR CHAT
   ========================================== */

async function loadChat(chatId) {

  currentChatId =
    chatId;


  localStorage.setItem(
    "chatxon_chat_id",
    chatId
  );


  closeSidebar();


  try {

    const res =
      await fetch("/get_chat", {

        method: "POST",

        headers: {

          "Content-Type":
          "application/json"

        },

        body: JSON.stringify({

          user_id:
          getUserId(),

          chat_id:
          chatId

        })

      });


    const data =
      await res.json();


    clearChat();


    if (
      data.messages &&
      data.messages.length > 0
    ) {

      data.messages.forEach(m => {

        if (m.role === "user") {

          addMessage(
            m.content,
            "user"
          );

        }

        else if (
          m.role === "assistant"
        ) {

          addMessage(
            m.content,
            "ai"
          );

        }

      });

    }

    else {

      await createNewChat();

    }


    loadChatList();


  } catch (e) {

    await createNewChat();

  }

}


/* ==========================================
   CREATE NEW CHAT
   ========================================== */

async function createNewChat() {

  try {

    const res =
      await fetch("/new_chat", {

        method: "POST",

        headers: {

          "Content-Type":
          "application/json"

        },

        body: JSON.stringify({

          user_id:
          getUserId()

        })

      });


    const data =
      await res.json();


    currentChatId =
      data.chat_id;


    localStorage.setItem(
      "chatxon_chat_id",
      currentChatId
    );


    showWelcome();

    loadChatList();

    closeSidebar();

    question.focus();


  } catch (e) {

    console.error(e);

  }

}


/* ==========================================
   FILE ATTACH
   ========================================== */

function handleFileSelect(e) {
  const files = Array.from(e.target.files || []);
  if (!files.length) return;

  files.forEach(function(file) {
    if (attachedFiles.length >= 3) {
      alert("Maximum 3 files at a time");
      return;
    }
    // Max 8MB original — we compress images before send
    if (file.size > 8 * 1024 * 1024) {
      alert("File too large (max 8MB): " + file.name);
      return;
    }
    attachedFiles.push(file);
  });

  renderAttachPreview();
  e.target.value = "";
}


function removeAttached(index) {
  attachedFiles.splice(index, 1);
  renderAttachPreview();
}


function renderAttachPreview() {
  const box = document.getElementById("attachPreview");
  if (!attachedFiles.length) {
    box.style.display = "none";
    box.innerHTML = "";
    return;
  }
  box.style.display = "flex";
  box.innerHTML = "";

  attachedFiles.forEach(function(file, idx) {
    const item = document.createElement("div");
    item.className = "attach-item";

    if (file.type && file.type.startsWith("image/")) {
      const img = document.createElement("img");
      img.src = URL.createObjectURL(file);
      item.appendChild(img);
    } else {
      const icon = document.createElement("div");
      icon.className = "file-icon";
      icon.textContent = file.name.length > 18 ? file.name.slice(0, 15) + "..." : file.name;
      item.appendChild(icon);
    }

    const btn = document.createElement("button");
    btn.className = "remove-btn";
    btn.innerHTML = "×";
    btn.onclick = function() { removeAttached(idx); };
    item.appendChild(btn);

    box.appendChild(item);
  });
}


function clearAttached() {
  attachedFiles = [];
  renderAttachPreview();
}


/* Compress image to max 1280px and JPEG quality 0.7 — keeps payload small */
function compressImage(file) {
  return new Promise(function(resolve, reject) {
    if (!file.type || !file.type.startsWith("image/")) {
      // non-image: just read as base64 (not sent to vision)
      const reader = new FileReader();
      reader.onload = function() { resolve(reader.result); };
      reader.onerror = reject;
      reader.readAsDataURL(file);
      return;
    }

    const img = new Image();
    const url = URL.createObjectURL(file);

    img.onload = function() {
      URL.revokeObjectURL(url);

      let w = img.width;
      let h = img.height;
      const maxSide = 1280;

      if (w > maxSide || h > maxSide) {
        if (w > h) {
          h = Math.round(h * (maxSide / w));
          w = maxSide;
        } else {
          w = Math.round(w * (maxSide / h));
          h = maxSide;
        }
      }

      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);

      // JPEG base64 — much smaller than original PNG/HEIC
      const dataUrl = canvas.toDataURL("image/jpeg", 0.7);
      resolve(dataUrl);
    };

    img.onerror = function() {
      URL.revokeObjectURL(url);
      reject(new Error("Could not load image"));
    };

    img.src = url;
  });
}


function fileToBase64(file) {
  return compressImage(file);
}


/* ==========================================
   SEND MESSAGE
   ========================================== */

async function sendMessage() {

  const text =
    question.value.trim();


  if (!text && attachedFiles.length === 0) {

    return;

  }


  if (!currentChatId) {

    await createNewChat();

  }


  // Prepare preview images for UI
  const previewSrcs = [];
  for (let i = 0; i < attachedFiles.length; i++) {
    const f = attachedFiles[i];
    if (f.type && f.type.startsWith("image/")) {
      previewSrcs.push(URL.createObjectURL(f));
    } else {
      previewSrcs.push({ name: f.name });
    }
  }

  addMessage(
    text || (attachedFiles.length ? "Sent attachment" : ""),
    "user",
    previewSrcs
  );


  const filesToSend = attachedFiles.slice();
  question.value = "";
  clearAttached();
  sendBtn.disabled = true;

  showThinking();


  try {

    // Convert images to base64 for API
    const imagesBase64 = [];
    for (let i = 0; i < filesToSend.length; i++) {
      const f = filesToSend[i];
      if (f.type && f.type.startsWith("image/")) {
        const b64 = await fileToBase64(f);
        imagesBase64.push(b64);
      }
    }

    const res =
      await fetch("/ask", {

        method: "POST",

        headers: {

          "Content-Type":
          "application/json"

        },

        body: JSON.stringify({

          question: text || "Please look at the attached image(s) and help me.",

          user_id:
          getUserId(),

          chat_id:
          currentChatId,

          images: imagesBase64

        })

      });


    removeThinking();

    let data;
    try {
      data = await res.json();
    } catch (parseErr) {
      addMessage(
        "Server returned invalid response (status " + res.status + "). Try a smaller image.",
        "ai"
      );
      sendBtn.disabled = false;
      question.focus();
      return;
    }


    if (data.answer) {

      addMessage(
        data.answer,
        "ai"
      );

    }

    else if (data.session_error) {

      await createNewChat();

      await fetchAgain(text || "Please look at the attached image(s) and help me.");

    }

    else {

      addMessage(
        data.error || "Something went wrong. Please try again.",
        "ai"
      );

    }


    loadChatList();


  } catch (e) {

    removeThinking();

    const msg = (e && e.message) ? e.message : "unknown";
    addMessage(
      "Connection error: " + msg + ". Try a smaller photo or check internet.",
      "ai"
    );

  }


  sendBtn.disabled = false;

  question.focus();

}


async function fetchAgain(text) {

  showThinking();

  try {

    const res =
      await fetch("/ask", {

        method: "POST",

        headers: {

          "Content-Type":
          "application/json"

        },

        body: JSON.stringify({

          question: text,

          user_id:
          getUserId(),

          chat_id:
          currentChatId

        })

      });


    const data =
      await res.json();


    removeThinking();


    if (data.answer) {

      addMessage(
        data.answer,
        "ai"
      );

    }

    else {

      addMessage(
        "Something went wrong. Please try again.",
        "ai"
      );

    }

  } catch (e) {

    removeThinking();

    addMessage(
      "Connection error. Please try again.",
      "ai"
    );

  }

}


/* ==========================================
   INITIALIZE
   ========================================== */

async function init() {

  const saved =
    localStorage.getItem(
      "chatxon_chat_id"
    );


  if (saved) {

    await loadChat(saved);

  }

  else {

    await createNewChat();

  }


  loadChatList();

}


question.addEventListener(
  "keydown",
  (e) => {

    if (
      e.key === "Enter" &&
      !e.shiftKey
    ) {

      e.preventDefault();

      sendMessage();

    }

  }
);


init();

question.focus();

</script>
