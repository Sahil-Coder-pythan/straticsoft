<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support – Help & Refunds</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:Inter,system-ui,sans-serif}</style>
</head>
<body class="bg-slate-50 text-gray-900 min-h-screen">
<div id="lockout" class="fixed inset-0 bg-white/95 z-50 hidden flex items-center justify-center p-6">
  <div class="max-w-lg w-full border border-red-200 rounded-2xl p-6 bg-white shadow-lg">
    <h2 class="text-lg font-bold text-red-600 mb-2">Support temporarily unavailable</h2>
    <pre id="lockoutMsg" class="text-sm text-gray-700 whitespace-pre-wrap bg-red-50 p-4 rounded-xl"></pre>
  </div>
</div>
<header class="bg-white border-b border-gray-200 sticky top-0 z-30">
  <div class="max-w-3xl mx-auto px-4 py-3 flex items-center gap-2">
    <div class="w-8 h-8 rounded-lg bg-indigo-600 text-white flex items-center justify-center text-sm font-bold">SS</div>
    <div>
      <div class="font-semibold text-sm">StraticSoft Support</div>
      <div class="text-[10px] text-gray-500" id="wsLabel">Refund · order status · escalate</div>
    </div>
  </div>
</header>
<main class="max-w-3xl mx-auto px-4 py-5 space-y-4">
  <div class="bg-white border border-gray-200 rounded-2xl p-4 shadow-sm">
    <label class="text-xs text-gray-500 block mb-2">Demo profile (sample until company CRM connected)</label>
    <select id="customerSelect" class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm bg-white">
      <option value="CUST001">Profile A · Premium</option>
      <option value="CUST002">Profile B · Standard</option>
      <option value="CUST003">Profile C · Premium</option>
      <option value="CUST004">Profile D · Standard</option>
      <option value="CUST005">Profile E · Premium</option>
    </select>
    <div id="custInfo" class="mt-3 text-xs text-gray-500"></div>
  </div>
  <div id="chat" class="bg-white border border-gray-200 rounded-2xl p-4 h-80 overflow-y-auto space-y-3 text-sm shadow-sm"></div>
  <div class="flex flex-wrap gap-2">
    <button type="button" onclick="quick('refund chahiye')" class="text-xs px-3 py-2 rounded-xl bg-red-50 text-red-700 border border-red-100">Refund</button>
    <button type="button" onclick="quick('order status')" class="text-xs px-3 py-2 rounded-xl bg-gray-100 text-gray-700">Order status</button>
    <button type="button" onclick="quick('complex problem')" class="text-xs px-3 py-2 rounded-xl bg-amber-50 text-amber-800 border border-amber-100">Complex problem</button>
  </div>
  <form onsubmit="send(event)" class="flex gap-2">
    <input id="msg" type="text" placeholder="Describe the issue…" class="flex-1 border border-gray-200 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-indigo-500 bg-white" autocomplete="off">
    <button type="submit" class="bg-indigo-600 text-white px-5 py-3 rounded-xl text-sm font-medium">Send</button>
  </form>
  <p class="text-[10px] text-center text-gray-400 pt-2">Support portal only · This company workspace only</p>
</main>
<script>
function detectWorkspace(){
  const parts = location.pathname.split('/').filter(Boolean);
  if(parts[0]==='w' && parts[1]) return parts[1];
  const q = new URLSearchParams(location.search).get('workspace');
  return q || 'default';
}
const WS = detectWorkspace();
// Notify StraticSoft when customer link opens (optional Gmail via NOTIFY_EMAIL)
fetch('/api/open-notify?workspace='+encodeURIComponent(WS), {
  method:'POST', headers:{'Content-Type':'application/json','X-Workspace-Id':WS},
  body: JSON.stringify({kind:'customer'})
}).catch(function(){});
fetch('/api/company/me?workspace='+encodeURIComponent(WS), {headers:{'X-Workspace-Id':WS}})
  .then(r=>r.json()).then(d=>{
    const el=document.getElementById('wsLabel');
    if(el) el.textContent = (d.tenant&&d.tenant.name?d.tenant.name:WS) + ' · support';
  }).catch(()=>{});
function apiHeaders(){
  return {'Content-Type':'application/json','X-Workspace-Id': WS};
}
function apiUrl(path){
  const u = new URL(path, location.origin);
  u.searchParams.set('workspace', WS);
  return u.toString();
}
const chat=document.getElementById('chat'),select=document.getElementById('customerSelect');
function add(t,w){const d=document.createElement('div');d.className=w==='user'?'text-right':'text-left';
  d.innerHTML=`<span class="inline-block max-w-[85%] px-3 py-2 rounded-2xl text-sm whitespace-pre-wrap ${w==='user'?'bg-indigo-600 text-white':'bg-gray-100 text-gray-800'}">${t}</span>`;
  chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
async function loadCustomer(){try{const r=await fetch(apiUrl('/api/customer/'+select.value),{headers:apiHeaders()});if(r.status===403){const d=await r.json();document.getElementById('lockout').classList.remove('hidden');document.getElementById('lockoutMsg').textContent=d.message||'Locked';return}
  document.getElementById('lockout').classList.add('hidden');const d=await r.json();
  const o=(d.orders||[]).map(x=>`${x.item} · ${x.PaymentStatus} · Rs.${x.amount}`).join('<br>')||'No orders';
  document.getElementById('custInfo').innerHTML=`<strong class="text-gray-900">${d.customer.name}</strong> · ${d.customer.tier}<br>${o}`}catch(e){}}
async function send(e){if(e)e.preventDefault();const input=document.getElementById('msg');const text=input.value.trim();if(!text)return;add(text,'user');input.value='';
  try{const r=await fetch(apiUrl('/api/chat'),{method:'POST',headers:apiHeaders(),body:JSON.stringify({message:text,customer_id:select.value})});const d=await r.json();
    if(d.locked){document.getElementById('lockout').classList.remove('hidden');document.getElementById('lockoutMsg').textContent=d.message;return}
    add(d.reply||'OK','bot');if(d.type==='refund_executed')loadCustomer()}catch(err){add('Network error','bot')}}
function quick(t){document.getElementById('msg').value=t;send()}
select.addEventListener('change',loadCustomer);loadCustomer();
add('Hello — use Refund, Order status, or Complex problem. Or type your issue below.','bot');
</script>
</body>
</html>
