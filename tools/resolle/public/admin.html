<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aapka AI · StraticSoft Console</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
body{font-family:Inter,system-ui,sans-serif;background:#f8fafc}
.drawer{transform:translateX(-100%);transition:transform .2s ease}
.drawer.open{transform:translateX(0)}
.overlay{opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.open{opacity:1;pointer-events:auto}
</style>
</head>
<body class="min-h-screen flex flex-col text-gray-900">
<header class="bg-white border-b border-gray-200 px-3 py-2.5 flex items-center gap-2 sticky top-0 z-40">
  <button type="button" onclick="toggleMenu()" class="w-10 h-10 rounded-xl hover:bg-gray-100 flex items-center justify-center" aria-label="Menu">
    <i class="fas fa-bars text-gray-700"></i>
  </button>
  <div class="flex items-center gap-2 flex-1 min-w-0">
    <div class="w-8 h-8 rounded-lg bg-indigo-600 text-white flex items-center justify-center text-sm font-bold">A</div>
    <div class="min-w-0">
      <div class="font-semibold text-sm leading-tight">Aapka AI · StraticSoft</div>
      <div class="text-[10px] text-gray-500 truncate" id="topSub">Console</div>
    </div>
  </div>
  <span id="companyBadge" class="text-[10px] px-2 py-1 rounded-full bg-indigo-50 text-indigo-700 font-medium max-w-[7rem] truncate">…</span>
  <span id="liveBadge" class="text-[10px] px-2 py-1 rounded-full bg-emerald-50 text-emerald-700 font-medium">…</span>
  <a id="custLink" href="/customer" class="text-xs font-medium text-indigo-600 px-2 py-1 rounded-lg hover:bg-indigo-50">Customers</a>
  <div class="relative ml-1">
    <button type="button" id="profileBtn" onclick="toggleProfileMenu(event)" class="w-9 h-9 rounded-full bg-indigo-600 text-white text-sm font-bold flex items-center justify-center shadow-sm ring-2 ring-white hover:bg-indigo-700" title="Profile">?</button>
    <div id="profileMenu" class="hidden absolute right-0 top-11 w-56 bg-white border border-gray-200 rounded-xl shadow-xl z-50 overflow-hidden">
      <div class="px-3 py-3 border-b border-gray-100">
        <p id="profileName" class="text-sm font-semibold text-gray-900 truncate">—</p>
        <p id="profileEmail" class="text-[11px] text-gray-500 truncate">—</p>
      </div>
      <button type="button" onclick="openEditProfile()" class="w-full text-left px-3 py-2.5 text-sm hover:bg-gray-50 flex items-center gap-2"><i class="fas fa-user-pen text-gray-400 w-4"></i> Edit profile</button>
      <button type="button" onclick="doLogout()" class="w-full text-left px-3 py-2.5 text-sm text-red-600 hover:bg-red-50 flex items-center gap-2 border-t border-gray-100"><i class="fas fa-right-from-bracket w-4"></i> Log out</button>
    </div>
  </div>
</header>
<div id="editProfileModal" class="hidden fixed inset-0 z-[60] flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-black/30" onclick="closeEditProfile()"></div>
  <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-sm p-5 space-y-3">
    <h3 class="font-semibold text-gray-900">Edit profile</h3>
    <p class="text-xs text-gray-500">Display name only (letter avatar updates automatically). No photo upload.</p>
    <input id="editNameInput" class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-500" maxlength="60" placeholder="Your name"/>
    <div class="flex gap-2 justify-end pt-1">
      <button type="button" onclick="closeEditProfile()" class="px-3 py-2 text-sm rounded-xl border border-gray-200">Cancel</button>
      <button type="button" onclick="saveProfile()" class="px-3 py-2 text-sm rounded-xl bg-indigo-600 text-white">Save</button>
    </div>
  </div>
</div>
<div id="wsBanner" class="hidden bg-amber-50 border-b border-amber-200 text-amber-900 text-xs px-3 py-2 text-center"></div>

<div id="overlay" class="overlay fixed inset-0 bg-black/25 z-40" onclick="toggleMenu(false)"></div>
<aside id="drawer" class="drawer fixed left-0 top-0 bottom-0 w-[18rem] max-w-[85vw] bg-white z-50 shadow-2xl flex flex-col border-r border-gray-100">
  <div class="p-4 border-b flex items-center justify-between">
    <span class="font-semibold text-sm">All modules</span>
    <button type="button" onclick="toggleMenu(false)" class="w-9 h-9 rounded-lg hover:bg-gray-100"><i class="fas fa-times text-gray-500"></i></button>
  </div>
  <div class="p-3 border-b">
    <input id="drawerSearch" type="search" placeholder="Filter modules…" class="w-full text-sm border border-gray-200 rounded-xl px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500" oninput="buildDrawer(this.value)">
  </div>
  <nav id="drawerNav" class="flex-1 overflow-y-auto py-2 text-sm"></nav>
</aside>

<main id="main" class="flex-1 overflow-y-auto px-4 py-5 pb-36 max-w-3xl mx-auto w-full"></main>

<div class="fixed bottom-0 inset-x-0 z-30 pointer-events-none">
  <div class="bg-gradient-to-t from-slate-50 via-slate-50/95 to-transparent pt-10 pb-4 px-4 pointer-events-auto">
    <div class="max-w-3xl mx-auto relative">
      <div id="searchHits" class="hidden absolute bottom-full left-0 right-0 mb-2 bg-white border border-gray-200 rounded-2xl shadow-xl max-h-64 overflow-y-auto"></div>
      <div class="bg-white border border-gray-300 rounded-2xl shadow-md flex items-center gap-2 px-4 py-3 focus-within:ring-2 focus-within:ring-indigo-500 focus-within:border-indigo-400">
        <i class="fas fa-search text-gray-400"></i>
        <input id="bottomSearch" type="search" placeholder="Search modules (refund, salesforce, cases…)" class="flex-1 text-sm outline-none bg-transparent" autocomplete="off"
          oninput="bottomSearch(this.value)" onkeydown="if(event.key==='Enter'){pickFirstHit()}">
        <button type="button" onclick="toggleMenu(true)" class="text-xs font-medium text-gray-500 hover:text-indigo-600">Menu</button>
      </div>
      <p class="text-center text-[10px] text-gray-400 mt-2">White console · connect stays here · no dark screens</p>
    </div>
  </div>
</div>
<script src="/admin-app.js"></script>
</body>
</html>
