services:
  - type: web
    name: straticsoft-hub
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python master.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: BUILDER_FLASK_SECRET_KEY
        generateValue: true
      - key: BUILDER_MASTER_ENCRYPTION_KEY
        sync: false
      - key: BUILDER_DATABASE_URL
        sync: false
      - key: ROUTER_SECRET_KEY
        generateValue: true
      - key: ROUTER_ADMIN_SECRET
        sync: false
      - key: ROUTER_DATABASE_URL
        sync: false
      - key: FASTAI_SECRET_KEY
        generateValue: true
      - key: FASTAI_MONGODB_URI
        sync: false
      - key: FASTAI_DATABASE_URL
        sync: false
